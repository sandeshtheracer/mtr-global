<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MTR Global Portal</title>

    <!-- Base & Components CSS -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="components/header.css">
    <link rel="stylesheet" href="components/footer.css">
    
    <!-- Page Specific CSS -->
    <link rel="stylesheet" href="css/login.css">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

    <!-- Header Dynamic Load Hoga -->
    <div id="header-container"></div>

    <!-- ==========================================
                    LOGIN SECTION
    =========================================== -->
    <section class="login-section">
        <div class="container login-container">
            
            <div class="login-card">
                <div class="login-header">
                    <h2>Portal Access</h2>
                    <p>Select your account type to access the MTR Global Portal.</p>
                </div>

                <!-- Account Type Switcher Tabs -->
                <div class="portal-tabs">
                    <button class="tab-btn active" onclick="switchTab('candidate')">
                        <i class="fas fa-user-graduate"></i> Candidate
                    </button>
                    <button class="tab-btn" onclick="switchTab('employer')">
                        <i class="fas fa-building"></i> Employer
                    </button>
                </div>

                <!-- Login Form -->
                <form class="login-form" id="loginForm" onsubmit="event.preventDefault(); alert('Login Attempted!');">
                    
                    <div class="form-group">
                        <label for="userEmail">Email Address / Application ID</label>
                        <div class="input-with-icon">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="userEmail" placeholder="Enter your email or ID" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="userPassword">Password</label>
                        <div class="input-with-icon">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="userPassword" placeholder="Enter your password" required>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox"> Remember Me
                        </label>
                        <a href="forgot-password.html" class="forgot-pass">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn-login">
                        <i class="fas fa-sign-in-alt"></i> Login to Portal
                    </button>

                </form>

                <div class="login-footer">
                    <p>Don't have an account? <a href="contact.html">Contact Us</a> to register.</p>
                </div>
            </div>

        </div>
    </section>

    <!-- Footer Dynamic Load Hoga -->
    <div id="footer-container"></div>

    <!-- Tab Switcher Script & Layout Loader -->
    <script src="js/layout-loader.js"></script>
    <script>
        function switchTab(type) {
            const tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach(tab => tab.classList.remove('active'));

            if (type === 'candidate') {
                tabs[0].classList.add('active');
            } else {
                tabs[1].classList.add('active');
            }
        }
    </script>
</body>
</html>
