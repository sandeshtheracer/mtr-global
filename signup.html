<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - MTR Global</title>

    <!-- Base & Components CSS -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="components/header.css">
    <link rel="stylesheet" href="components/footer.css">
    
    <!-- Page Specific CSS -->
    <link rel="stylesheet" href="css/signup.css">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

    <!-- Header Dynamic Load Hoga -->
    <div id="header-container"></div>

    <!-- ==========================================
                    SIGNUP SECTION
    =========================================== -->
    <section class="signup-section">
        <div class="container signup-container">
            
            <div class="signup-card">
                <div class="signup-header">
                    <h2>Create an Account</h2>
                    <p>Join MTR Global to track applications or hire international workforce.</p>
                </div>

                <!-- Account Type Switcher -->
                <div class="portal-tabs">
                    <button class="tab-btn active" id="btn-candidate" onclick="switchAccountType('candidate')">
                        <i class="fas fa-user"></i> Candidate
                    </button>
                    <button class="tab-btn" id="btn-employer" onclick="switchAccountType('employer')">
                        <i class="fas fa-building"></i> Employer
                    </button>
                </div>

                <!-- Signup Form -->
                <form class="signup-form" id="signupForm" onsubmit="event.preventDefault(); alert('Account Registered Successfully!');">
                    
                    <div class="form-group">
                        <label for="fullName">Full Name / Company Name</label>
                        <div class="input-with-icon">
                            <i class="fas fa-id-card"></i>
                            <input type="text" id="fullName" placeholder="e.g. John Doe / Tech Solutions" required>
                        </div>
                    </div>

                    <div class="form-group-row">
                        <div class="form-group">
                            <label for="userEmail">Email Address</label>
                            <div class="input-with-icon">
                                <i class="fas fa-envelope"></i>
                                <input type="email" id="userEmail" placeholder="name@example.com" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="userPhone">Phone Number</label>
                            <div class="input-with-icon">
                                <i class="fas fa-phone"></i>
                                <input type="tel" id="userPhone" placeholder="+1234567890" required>
                            </div>
                        </div>
                    </div>

                    <!-- Dynamic Field (Swaps based on Candidate vs Employer) -->
                    <div class="form-group" id="dynamicField">
                        <label for="passportTrade">Passport Number / Trade Specialization</label>
                        <div class="input-with-icon">
                            <i class="fas fa-briefcase"></i>
                            <input type="text" id="passportTrade" placeholder="e.g. Electrician / Heavy Driver / Welder" required>
                        </div>
                    </div>

                    <div class="form-group-row">
                        <div class="form-group">
                            <label for="userPassword">Password</label>
                            <div class="input-with-icon">
                                <i class="fas fa-lock"></i>
                                <input type="password" id="userPassword" placeholder="Create password" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="confirmPassword">Confirm Password</label>
                            <div class="input-with-icon">
                                <i class="fas fa-shield-alt"></i>
                                <input type="password" id="confirmPassword" placeholder="Repeat password" required>
                            </div>
                        </div>
                    </div>

                    <div class="terms-option">
                        <label class="checkbox-label">
                            <input type="checkbox" required> I agree to the <a href="#">Terms & Conditions</a> and <a href="#">Privacy Policy</a>.
                        </label>
                    </div>

                    <button type="submit" class="btn-signup">
                        <i class="fas fa-user-plus"></i> Register Account
                    </button>

                </form>

                <div class="signup-footer">
                    <p>Already have an account? <a href="login.html">Login here</a></p>
                </div>
            </div>

        </div>
    </section>

    <!-- Footer Dynamic Load Hoga -->
    <div id="footer-container"></div>

    <!-- Script & Layout Loader -->
    <script src="js/layout-loader.js"></script>
    <script>
        function switchAccountType(type) {
            const btnCandidate = document.getElementById('btn-candidate');
            const btnEmployer = document.getElementById('btn-employer');
            const dynamicField = document.getElementById('dynamicField');

            if (type === 'candidate') {
                btnCandidate.classList.add('active');
                btnEmployer.classList.remove('active');
                dynamicField.innerHTML = `
                    <label for="passportTrade">Trade / Specialization</label>
                    <div class="input-with-icon">
                        <i class="fas fa-briefcase"></i>
                        <input type="text" id="passportTrade" placeholder="e.g. Electrician / Welder / Driver" required>
                    </div>
                `;
            } else {
                btnEmployer.classList.add('active');
                btnCandidate.classList.remove('active');
                dynamicField.innerHTML = `
                    <label for="passportTrade">Company Registration No / Sector</label>
                    <div class="input-with-icon">
                        <i class="fas fa-industry"></i>
                        <input type="text" id="passportTrade" placeholder="e.g. Construction / Healthcare" required>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
