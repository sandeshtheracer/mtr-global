<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results - MTR Global</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="components/header.css">
    <link rel="stylesheet" href="components/footer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        .search-container {
            max-width: 1100px;
            margin: 3rem auto;
            padding: 0 1.5rem;
            min-height: 60vh;
        }
        .search-header {
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }
        .search-title {
            font-size: 1.75rem;
            color: #ffffff;
        }
        .search-title span {
            color: #00b4d8;
        }
        .results-list {
            display: grid;
            gap: 1.25rem;
        }
        .result-card {
            background: #1d5056;
            padding: 1.25rem 1.5rem;
            border-radius: 0.75rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease;
        }
        .result-card:hover {
            transform: translateY(-3px);
            border-color: #00b4d8;
        }
        .result-card h3 {
            margin-bottom: 0.5rem;
        }
        .result-card h3 a {
            color: #00b4d8;
            text-decoration: none;
            font-size: 1.2rem;
        }
        .result-card p {
            color: #d6d6d6;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .no-results {
            text-align: center;
            padding: 3rem;
            color: #a0a0a0;
        }
        .no-results i {
            font-size: 3rem;
            color: #00b4d8;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

    <!-- Dynamic Header -->
    <div id="header-container"></div>

    <!-- Main Search Content -->
    <main class="search-container">
        <div class="search-header">
            <h1 class="search-title">Search Results for: <span id="search-query-text">"..."</span></h1>
        </div>

        <div id="results-container" class="results-list">
            <!-- Results JS se yahan dynamically load honge -->
        </div>
    </main>

    <!-- Dynamic Footer -->
    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="js/layout-loader.js"></script>
    <script src="js/search.js"></script>
</body>
</html>
