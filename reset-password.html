<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Password - MTR Global</title>

    <!-- Base & Components CSS -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="components/header.css">
    <link rel="stylesheet" href="components/footer.css">
    
    <!-- Page Specific CSS -->
    <link rel="stylesheet" href="css/forgot-password.css">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

    <!-- Header Dynamic Load Hoga -->
    <div id="header-container"></div>

    <!-- ==========================================
                CREATE NEW PASSWORD SECTION
    =========================================== -->
    <section class="reset-section">
        <div class="container reset-container">
            
            <div class="reset-card">
                <div class="reset-header">
                    <div class="reset-icon">
                        <i class="fas fa-lock"></i>
                    </div>
                    <h2>Set New Password</h2>
                    <p>Please enter your new password below to secure your account.</p>
                </div>

                <!-- Reset Form -->
                <form class="reset-form" id="newPasswordForm" onsubmit="event.preventDefault(); alert('Password Updated Successfully! Redirecting to login...'); window.location.href='login.html';">
                    
                    <div class="form-group">
                        <label for="newPassword">New Password</label>
                        <div class="input-with-icon">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="newPassword" placeholder="Enter new password" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirmNewPassword">Confirm New Password</label>
                        <div class="input-with-icon">
                            <i class="fas fa-shield-alt"></i>
                            <input type="password" id="confirmNewPassword" placeholder="Confirm new password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn-reset">
                        <i class="fas fa-check-circle"></i> Update Password
                    </button>

                </form>

                <div class="reset-footer">
                    <p>Back to <a href="login.html"><i class="fas fa-sign-in-alt"></i> Login</a></p>
                </div>
            </div>

        </div>
    </section>

    <!-- Footer Dynamic Load Hoga -->
    <div id="footer-container"></div>

    <!-- Layout Loader JS -->
    <script src="js/layout-loader.js"></script>
</body>
</html>
