<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTR Global Home</title>
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <header class="main-header">
        <div class="container">
            <nav class="navbar">

                <!-- Logo Section -->
                <div class="navbar-left">
                    <div class="navbar-brand-group">
                        <a href="index.html" class="navbar-brand-link">
                            <img src="./mtr-global-logo.png" alt="MTR Global Logo" class="navbar-brand-logo">
                            <span class="navbar-brand-name">MTR Global</span>
                            <small class="navbar-brand-tagline">Overseas Manpower Service</small>
                        </a>
                    </div>
                </div>

                <!-- Mobile Toggle Button (Sahi jagah par moved) -->
                <div class="navbar-toggle">
                    <button class="navbar-toggle-button" aria-label="Toggle navigation menu" aria-expanded="false">
                        <i class="fas fa-bars"></i>
                    </button>
                </div>

                <!-- Right Side Menu Section -->
                <div class="navbar-right">
                    <ul class="navbar-menu">
                        <li class="navbar-item"><a href="index.html" class="navbar-link"><i class="fas fa-home"></i> Home</a></li>
                        <li class="navbar-item"><a href="about.html" class="navbar-link"><i class="fas fa-info-circle"></i> About Us</a></li>
                        <li class="navbar-item"><a href="services.html" class="navbar-link"><i class="fas fa-cogs"></i> Services</a></li>
                        <li class="navbar-item"><a href="contact.html" class="navbar-link"><i class="fas fa-phone"></i> Contact</a></li>
                    </ul>

                    <!-- Search Section -->
                    <form class="navbar-search" action="search.html" method="get">
                        <input type="search" name="search" placeholder="Search..." aria-label="Search">
                        <button type="submit"><i class="fas fa-search"></i></button>
                    </form>

                    <!-- Actions -->
                    <div class="navbar-actions">
                        <a href="login.html" class="navbar-action-link"><i class="fas fa-sign-in-alt"></i> Login</a>
                        <a href="signup.html" class="navbar-action-link"><i class="fas fa-user-plus"></i> Sign Up</a>
                    </div>

                    <!-- Language -->
                    <div class="navbar-language">
                        <i class="fas fa-globe"></i>
                        <select class="navbar-language-select" id="customLangSelect">
                            <option value="en">English</option>
                            <option value="ar">Arabic</option>
                            <option value="hi">Hindi</option>
                        </select>
                    </div>
                </div>

            </nav>
        </div>
    </header>








    <script src="header.js"></script>
    <!-- Layout Loader JS & Translation JS -->
    <script src="js/layout-loader.js"></script>
    <script src="js/translation.js"></script>
</body>

</html>
