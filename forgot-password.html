<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - MTR Global</title>

    <!-- Base & Components CSS -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="components/header.css">
    <link rel="stylesheet" href="components/footer.css">
    
    <!-- Page Specific CSS -->
    <link rel="stylesheet" href="css/forgot-password.css">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>

    <!-- Header Dynamic Load Hoga -->
    <div id="header-container"></div>

    <!-- ==========================================
                FORGOT PASSWORD SECTION
    =========================================== -->
    <section class="reset-section">
        <div class="container reset-container">
            
            <div class="reset-card">
                <div class="reset-header">
                    <div class="reset-icon">
                        <i class="fas fa-key"></i>
                    </div>
                    <h2>Reset Your Password</h2>
                    <p>Enter your registered email address and we'll send you a link to reset your password.</p>
                </div>

                <!-- Reset Form -->
                <form class="reset-form" id="resetForm" onsubmit="event.preventDefault(); alert('Password reset link sent to your email!');">
                    
                    <div class="form-group">
                        <label for="resetEmail">Email Address</label>
                        <div class="input-with-icon">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="resetEmail" placeholder="Enter your registered email" required>
                        </div>
                    </div>

                    <button type="submit" class="btn-reset">
                        <i class="fas fa-paper-plane"></i> Send Reset Link
                    </button>

                </form>

                <div class="reset-footer">
                    <p>Remembered your password? <a href="login.html"><i class="fas fa-arrow-left"></i> Back to Login</a></p>
                </div>
            </div>

        </div>
    </section>

    <!-- Footer Dynamic Load Hoga -->
    <div id="footer-container"></div>

    <!-- Layout Loader JS -->
    <script src="js/layout-loader.js"></script>
</body>
</html>
